[package]
name = "beacon-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Internal Tauri shell for the Beacon local-alpha application"
publish = false

[lib]
name = "beacon_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
libc.workspace = true
beacond = { path = "../../../crates/beacond" }
serde.workspace = true
tauri = { version = "=2.11.5", features = [] }
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true
