name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  quality:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # SHAs are pinned rather than floating tags, matching the sibling repos.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - name: Whitespace errors
        run: git diff --check

  tests:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # A break on one interpreter must not cancel the others, or a
      # version-specific failure reads as a total failure.
      fail-fast: false
      matrix:
        # 3.11 is the floor declared by requires-python.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: python -VV
      - run: pytest

  no-runtime-dependencies:
    name: Zero runtime dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      # Installed WITHOUT the dev extra and outside the checkout: if a runtime
      # dependency ever creeps into pyproject, or a module reaches for a
      # third-party import, this job is where it shows up. The zero-dependency
      # line is a property the fleet inherits, so it gets its own gate.
      - run: pip install .
      - name: Import and run the CLI from a clean directory
        run: |
          cd "$(mktemp -d)"
          python -c "import beacon_legacy, beacon_legacy.cli, beacon_legacy.render; print(beacon_legacy.__version__)"
          beacon-legacy-desk version
          beacon-legacy-desk --help > /dev/null
      - name: Assert nothing but the package itself was installed
        run: |
          extra=$(pip freeze --exclude-editable | grep -iv '^beacon-legacy-desk' || true)
          if [ -n "$extra" ]; then
            echo "Unexpected runtime dependencies installed:"
            echo "$extra"
            exit 1
          fi
          echo "No runtime dependencies. Good."
