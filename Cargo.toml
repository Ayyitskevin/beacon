[workspace]
members = ["apps/desktop/src-tauri", "crates/beacond"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"

[workspace.dependencies]
argon2 = { version = "=0.6.0", features = ["zeroize"] }
data-encoding = "=2.11.1"
dbus = "=0.9.12"
getrandom = "=0.4.3"
libc = "=0.2.189"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
subtle = "=2.6.1"
ureq = { version = "=3.4.0", default-features = false }
uuid = { version = "=1.26.0", features = ["serde", "v4"] }
zeroize = "=1.9.0"
